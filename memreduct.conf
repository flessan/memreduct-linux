# Mem Reduct for Linux - configuration
#
# System-wide file:  /etc/memreduct.conf
# Per-user override: ~/.config/memreduct/memreduct.conf
# Command-line options override both.
#
# The daemon reloads this file on SIGHUP:  systemctl reload memreduct

# Automatically clean memory when usage reaches this percentage.
# 0 disables threshold-based cleaning. (default: 90)
clean_threshold = 90

# Additionally clean memory every N minutes. 0 disables timer-based
# cleaning. (default: 0)
clean_interval = 0

# How often the daemon checks memory usage, in seconds. (default: 5)
check_interval = 5

# Minimum seconds between two threshold-triggered cleans, to avoid
# cleaning in a tight loop while memory stays high. (default: 60)
cooldown = 60

# Memory areas to clean.
# clean_pagecache : drop clean page cache      (echo 1 > drop_caches)
# clean_dentries  : drop dentries and inodes   (echo 2 > drop_caches)
# clean_compact   : defragment physical memory (compact_memory)
# clean_swap      : flush swap back to RAM     (swapoff -a && swapon -a)
clean_pagecache = yes
clean_dentries = yes
clean_compact = yes
clean_swap = no

# Colour levels for 'status' and 'monitor' output, in percent.
warning_level = 60
danger_level = 90

# Send desktop notifications after automatic cleaning (needs notify-send).
notifications = yes

# Also log daemon events to syslog/journal.
syslog = yes
