# Mem Reduct for Linux - configuration
#
# System-wide file:  /etc/memreduct.conf
# Per-user override: ~/.config/memreduct/memreduct.conf
# Command-line options override both.
# The daemon reloads this file on SIGHUP: systemctl reload memreduct

# Auto-clean when physical memory usage reaches this percentage.
# 0 disables the usage trigger. (default: 90)
clean_threshold = 90

# Auto-clean when memory PSI avg10 reaches this percentage.
# Requires /proc/pressure/memory; 0 disables it.
clean_pressure = 0

# PSI trigger metric: some (any task stalled) or full (all non-idle tasks stalled).
# 'full' is stricter and indicates severe memory thrashing.
clean_pressure_type = some

# Additionally clean every N minutes. 0 disables timer-based cleaning.
clean_interval = 0

# How often the daemon checks memory usage, in seconds.
check_interval = 5

# Minimum seconds between automatic cleanups triggered by usage or PSI.
cooldown = 60

# Memory areas to clean.
# clean_pagecache    : drop clean page cache (drop_caches=1)
# clean_dentries     : drop reclaimable dentries/inodes (drop_caches=2)
# clean_compact      : compact fragmented physical memory
# clean_modifiedcache: system-wide sync of dirty file-backed pages
# Cache eviction also syncs first to avoid dropping dirty data.
# clean_swap         : reload swap into RAM (swapoff/swapon; use with care)
clean_pagecache = yes
clean_dentries = yes
clean_compact = yes
clean_modifiedcache = yes
clean_swap = no

# Colour levels for 'status' and 'monitor' output, in percent.
warning_level = 60
danger_level = 90

# Send desktop notifications after automatic cleaning (needs notify-send).
notifications = yes

# Also log daemon events to syslog/journal.
syslog = yes
