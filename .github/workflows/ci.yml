name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke test (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install compiler
        if: matrix.compiler == 'clang'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Build
        run: make clean all
        env:
          CC: ${{ matrix.compiler }}

      - name: Smoke tests
        run: make test
